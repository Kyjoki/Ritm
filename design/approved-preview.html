    {
      const root=document.getElementById(&#x27;ritm-violet-states&#x27;);

      const picker=root.querySelector(&#x27;[data-preview]&#x27;);
      const preview={state:&#x27;task&#x27;,theme:&#x27;light&#x27;};
      let lastAction=&#x27;delete&#x27;;
      let retryTimer;
      function remember(){if(window.openai?.setWidgetState) window.openai.setWidgetState({modelContent:{preview:preview.state,theme:preview.theme},privateContent:{preview:{...preview}}}).catch(()=&gt;{});}
      function render(){root.querySelectorAll(&#x27;[data-state]&#x27;).forEach(panel=&gt;panel.hidden=panel.dataset.state!==preview.state);picker.value=preview.state;product.classList.toggle(&#x27;rs-dark&#x27;,preview.theme===&#x27;dark&#x27;);root.querySelectorAll(&#x27;[data-theme]&#x27;).forEach(button=&gt;button.setAttribute(&#x27;aria-pressed&#x27;,String(button.dataset.theme===preview.theme)));}

      function feedback(message){const box=product.querySelector(&#x27;[data-feedback]&#x27;);box.textContent=message;box.hidden=false;}
      function restoreSaved(snapshot){const saved=snapshot?.privateContent?.preview;if(saved&amp;&amp;root.querySelector(&#x27;[data-state=&quot;&#x27;+saved.state+&#x27;&quot;]&#x27;)) preview.state=saved.state;if(saved?.theme===&#x27;light&#x27;||saved?.theme===&#x27;dark&#x27;)preview.theme=saved.theme;render();}
      restoreSaved(window.openai?.widgetState);
      window.addEventListener(&#x27;openai:set_globals&#x27;,event=&gt;restoreSaved(event.detail?.globals?.widgetState));
      picker.addEventListener(&#x27;change&#x27;,()=&gt;go(picker.value));
      root.querySelectorAll(&#x27;[data-theme]&#x27;).forEach(button=&gt;button.addEventListener(&#x27;click&#x27;,()=&gt;{preview.theme=button.dataset.theme;render();remember();}));
      product.querySelectorAll(&#x27;[data-go]&#x27;).forEach(button=&gt;button.addEventListener(&#x27;click&#x27;,()=&gt;go(button.dataset.go)));
      const changes=[...product.querySelectorAll(&#x27;[data-change]&#x27;)];
      const apply=product.querySelector(&#x27;[data-apply]&#x27;);
      function updateCount(){const count=changes.filter(input=&gt;input.checked).length;apply.textContent=&#x27;Применить · &#x27;+count;apply.disabled=count===0;product.querySelector(&#x27;[data-benefit]&#x27;).textContent=count===2?&#x27;После 17:15 все дела будут завершены&#x27;:count===1?&#x27;Перенесём только выбранную задачу&#x27;:&#x27;Выбери изменения, которые тебе подходят&#x27;;}
      changes.forEach(input=&gt;input.addEventListener(&#x27;change&#x27;,updateCount));
      const proposal=product.querySelector(&#x27;[data-proposal-changes]&#x27;);
      const proposalResult=product.querySelector(&#x27;[data-proposal-result]&#x27;);
      const proposalUndo=product.querySelector(&#x27;[data-proposal-undo]&#x27;);
      const reject=product.querySelector(&#x27;[data-reject]&#x27;);
      apply.addEventListener(&#x27;click&#x27;,()=&gt;{const count=changes.filter(input=&gt;input.checked).length;proposal.hidden=true;proposalResult.textContent=count===1?&#x27;Выбранное изменение применено. Расписание обновлено.&#x27;:&#x27;Изменения применены. Расписание обновлено.&#x27;;proposalResult.hidden=false;apply.hidden=true;reject.hidden=true;proposalUndo.textContent=&#x27;Отменить изменения&#x27;;proposalUndo.hidden=false;});
